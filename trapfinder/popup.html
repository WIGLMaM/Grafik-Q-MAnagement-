<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>TrapFinder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="icons/icon32.png" alt="" width="24" height="24">TrapFinder</h1>
    <button id="scan" class="primary">Kurs scannen</button>
  </header>

  <div id="filters" class="filters">
    <div class="legend">Suchen nach <button id="toggleAll" class="link" type="button">alle / keine</button></div>
  </div>

  <div id="status" class="status">Öffne einen Rise-Kurs und klicke auf «Kurs scannen».</div>

  <div id="actions" class="actions" hidden>
    <button id="exportHtml">Protokoll (HTML)</button>
    <button id="exportCsv">Protokoll (CSV)</button>
  </div>

  <div id="fallback" class="fallback" hidden>
    <p>Die Kursdaten konnten nicht direkt gelesen werden. Die Erweiterung kann sich stattdessen
      durch alle Lektionen klicken und die Seite selbst untersuchen. Das dauert etwas länger.</p>
    <button id="crawl">Lektionen durchsuchen</button>
  </div>

  <main id="results"></main>

  <footer>
    <button id="diagnose" class="link" type="button">Diagnose (falls nichts gefunden wird)</button>
    <div id="diagBox" hidden>
      <textarea id="diagText" readonly></textarea>
      <button id="diagCopy" type="button">In Zwischenablage kopieren</button>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
